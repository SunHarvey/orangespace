name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core-and-tunnel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --workspace --locked
      - name: Native model checks
        run: |
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Verify actual TUIC TCP and UDP
        run: |
          curl -fL --retry 3 https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz -o /tmp/sing-box.tar.gz
          echo '699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968  /tmp/sing-box.tar.gz' | sha256sum -c -
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          python3 scripts/smoke_tuic.py --sing-box /tmp/sing-box-1.14.4-linux-amd64/sing-box
          ORANGESPACE_TEST_SING_BOX=/tmp/sing-box-1.14.4-linux-amd64/sing-box cargo test -p orangespace-core --locked --test helper_runtime -- --ignored
  node:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orangespace_test
          POSTGRES_USER: orangespace_test
          POSTGRES_PASSWORD: ci-only-not-a-deployment-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orangespace_test -d orangespace_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.lock -e '.[test]'
        working-directory: server
      - name: Dependency lock and offline fixture validation (not browser validation)
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python -m pytest
        working-directory: server
        env:
          ORANGESPACE_TEST_POSTGRES_URL: postgresql+psycopg://orangespace_test:ci-only-not-a-deployment-secret@127.0.0.1:5432/orangespace_test
      - name: Real HTTP file lifecycle
        run: python scripts/smoke_node.py
  windows-manager:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Rust helper lifecycle tests on Windows (not WFP validation)
        shell: pwsh
        run: cargo test -p orangespace-core --locked
      - name: Build native manager and block-only WFP component
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Compile pinned CEF bootstrap/client.dll (never launch browser)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap {
            $failure = ($_.Exception.Message + "`n" + $_.ScriptStackTrace).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=CEF validation failure::$failure"
            exit 1
          }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'MSVC installation not found' }
          $tools = Get-ChildItem (Join-Path $installation 'VC/Tools/MSVC') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $env:PATH = (Join-Path $tools.FullName 'bin/Hostx64/x64') + [IO.Path]::PathSeparator + $env:PATH
          $lock = Get-Content apps/windows-client/cef/cef.lock.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP $lock.archive
          Invoke-WebRequest -Uri $lock.archive_url -OutFile $archive
          $logPath = Join-Path $env:RUNNER_TEMP 'orangespace-cef-build.log'
          try {
            ./scripts/cef-build-windows.ps1 -Archive $archive -BuildDirectory (Join-Path $env:RUNNER_TEMP ('orangespace-cef-' + [guid]::NewGuid().ToString('N'))) *>&1 | Tee-Object -FilePath $logPath
          } catch {
            $details = if (Test-Path $logPath) { (Get-Content $logPath -Tail 60) -join "`n" } else { $_.Exception.Message }
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=CEF build diagnostics::$details"
            throw
          }
