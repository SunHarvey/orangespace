[package]
name = "orangespace-https"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ureq = { version = "=3.3.0", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.35", default-features = false, features = ["std", "ring", "tls12"] }
