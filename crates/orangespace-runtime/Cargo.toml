[package]
name = "orangespace-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[lib]
name = "orangespace_runtime"
crate-type = ["staticlib", "rlib"]

[dependencies]
orangespace-core = { path = "../orangespace-core" }
orangespace-https = { path = "../orangespace-https" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
