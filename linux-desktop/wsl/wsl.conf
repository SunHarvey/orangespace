# /etc/wsl.conf of the OrangeSpace distribution.
[boot]
systemd=true

# Sandbox code must not reach the user's Windows drives or start Windows
# programs, even after escaping its container to the distribution's root.
[automount]
enabled=false
mountFsTab=false

[interop]
enabled=false
appendWindowsPath=false

[user]
default=desk

[network]
generateHosts=true
generateResolvConf=true
