[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "orangespace-node"
version = "0.1.0"
description = "OrangeSpace authenticated Linux personal file node"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.8,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "SQLAlchemy>=2.0.40,<2.1",
  "argon2-cffi>=23.1,<26",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[project.scripts]
orangespace-node = "orangespace_node.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["orangespace_node"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
